name: Keep Supabase warm

# Supabase free-tier projects auto-pause after ~7 days of inactivity, which
# takes the whole API down. A daily request to the DB-backed health endpoint
# keeps the project active. Runs even if the rest of the app is idle.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging backend to keep the Supabase database warm..."
          curl -fsS --max-time 30 "https://hireflow-api.vercel.app/api/health"
          echo
