  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#FFFFFF" stroke="#E5DDD3" stroke-width="2"/>

  <g opacity="0.95">
